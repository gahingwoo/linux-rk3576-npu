# Build a kernel a ROCK 4D can boot with the NPU working, and publish it so
# charsiu-install.sh has something to offer.
#
# ⚠ WHY THIS EXISTS. RK3576 rocket support is not upstream. The commit adding
# `rockchip,rk3576-rknn-core` is ours and is not reachable from any tag, so no
# distribution kernel anywhere will bind this NPU and the installer would have
# nothing to do but say no.
#
# ⚠ THE BASE IS A MAINLINE RELEASE, NOT linux-next. next moves under you, it is
# not what anyone means by a kernel, and a board is not the place to find out
# what landed yesterday. v7.2 is the newest release and it already carries
# drivers/accel/rocket for RK3588.
#
# It does NOT carry four fixes that went in after it, and the v9 series was
# written on a tree that has them. Measured: without them patch 4 fails on
# rocket_job.c and patch 8 fails on pm-domains.c. They are cherry-picked into
# kernel/backport-7.2/, they are other people's upstream commits, and that
# directory goes away when 7.3 ships. See its README.
#
# The full stack, verified to apply and compile on a clean v7.2 on 2026-08-25:
#   4 upstream backports + 1 declared prerequisite (Igor's) + the 13 of v9.
name: kernel

on:
  workflow_dispatch:
    inputs:
      base:
        description: "mainline tag to build on"
        default: "v7.2"
      release:
        description: "publish a release"
        type: boolean
        default: false
  push:
    paths:
      - 'rfc-send-v9/**'
      - 'kernel/backport-7.2/**'
      - 'kernel/base.config'
      - '.github/workflows/kernel.yml'

permissions:
  contents: write

jobs:
  build:
    # native aarch64: no cross toolchain to get wrong, and quicker than
    # cross-compiling on x86.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev bc \
            python3 ccache zstd

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.base || 'v7.2' }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.base || 'v7.2' }}-

      - name: fetch mainline at the pinned release
        run: |
          BASE="${{ inputs.base || 'v7.2' }}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$BASE" \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux
          git -C linux log --oneline -1

      - name: apply the stack
        run: |
          cd linux
          git config user.email ci@example.invalid
          git config user.name "charsiu CI"
          apply() {
            for p in $1; do
              case "$p" in *v9-0000-*) continue ;; esac   # the cover letter
              echo "== $(basename "$p")"
              git am --keep-cr "$p" || {
                echo "::error::$(basename "$p") did not apply to $BASE"
                git am --abort || true
                exit 1
              }
            done
          }
          # ⚠ ORDER MATTERS: upstream fixes, then the prerequisite the v9 cover
          # letter names, then the series itself.
          apply "../kernel/backport-7.2/*.patch"
          apply "../rfc-send-v9/prereq/*.patch"
          apply "../rfc-send-v9/v9-00[0-9][0-9]-*.patch"
          git log --oneline -18

      - name: build
        run: |
          cd linux
          cp ../kernel/base.config .config
          make ARCH=arm64 olddefconfig
          # ⚠ DRM FIRST. DRM_ACCEL_ROCKET selects DRM_SCHED and
          # DRM_GEM_SHMEM_HELPER, so it cannot be y while DRM is m. Measured:
          # enabling only ROCKET leaves it at m and the assert below fails.
          scripts/config --enable DRM --enable DRM_ACCEL
          scripts/config --enable DRM_ACCEL_ROCKET
          # This rootfs has no udev and no mdev, so a module is NEVER loaded by
          # modalias. Anything a device needs has to be built in.
          scripts/config --enable STMMAC_ETH --enable STMMAC_PLATFORM
          scripts/config --enable DWMAC_ROCKCHIP --enable REALTEK_PHY
          scripts/config --enable RTC_DRV_HYM8563
          make ARCH=arm64 olddefconfig
          bad=0
          for s in DRM_ACCEL_ROCKET STMMAC_ETH DWMAC_ROCKCHIP RTC_DRV_HYM8563; do
            v=$(scripts/config --state $s)
            echo "  $s = $v"
            [ "$v" = "y" ] || { echo "::error::$s is $v, not y"; bad=1; }
          done
          [ "$bad" = 0 ]
          make ARCH=arm64 -j"$(nproc)" CC="ccache gcc" Image dtbs modules
          make ARCH=arm64 INSTALL_MOD_PATH=../modroot modules_install

      - name: package
        run: |
          mkdir -p out
          cp linux/arch/arm64/boot/Image out/
          cp linux/arch/arm64/boot/dts/rockchip/rk3576-rock-4d.dtb out/
          KVER=$(cat linux/include/config/kernel.release)
          tar -C modroot -czf "out/modules-$KVER.tar.gz" lib/modules
          {
            echo "base        $BASE  (a mainline release, not linux-next)"
            # ⚠ NOT ../ HERE. The apply step runs inside linux/, this one runs
            # at the workspace root, and the first build reported "backports 0"
            # in a manifest people are meant to trust while having applied all
            # four. A count that can silently read zero is worse than no count.
            nbp=$(ls kernel/backport-7.2/*.patch 2>/dev/null | wc -l)
            [ "$nbp" -gt 0 ] || { echo "::error::the backport count came out 0"; exit 1; }
            echo "backports   $nbp upstream fixes that landed after $BASE"
            echo "prereq      1 (Igor Paunovic, clocks by name, declared by the v9 cover letter)"
            echo "series      v9, 13 patches"
            echo "kernel      $KVER"
            echo "built       $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repo        ${{ github.repository }}@${{ github.sha }}"
          } > out/MANIFEST
          ( cd out && sha256sum Image rk3576-rock-4d.dtb modules-*.tar.gz > SHA256SUMS )
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          cat out/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KVER }}
          path: out/

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="kernel-$KVER-$(date -u +%Y%m%d)"
          gh release create "$TAG" out/* --title "$TAG" --notes \
          "RK3576 NPU kernel: mainline $BASE, four upstream fixes that landed
          after it, Igor Paunovic's clocks-by-name prerequisite, and the v9
          rocket series.

          charsiu-install.sh fetches this. It keeps the kernel already on the
          card as a second extlinux entry, so if this one misbehaves the old
          one is one boot menu away."
