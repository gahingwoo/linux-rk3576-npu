# Build a kernel a ROCK 4D can boot with the NPU working, and publish it so
# charsiu-install.sh has something to offer.
#
# WHY THIS EXISTS. RK3576 rocket support is not upstream. The commit adding
# `rockchip,rk3576-rknn-core` is ours and is not reachable from any tag, so no
# distribution kernel anywhere will bind this NPU and the installer would have
# nothing to do but say no.
#
# THE BASE IS A linux-next TAG, AND IT USED TO BE A MAINLINE RELEASE. The
# argument for v7.2 was that next moves under you and a board is not the place
# to find out what landed yesterday. That is still true of next as a BRANCH.
# It is not true of a next TAG, which is immutable, and the reason to move is
# that the thing being shipped is the series:
#
#   - what applies to v7.2 is v11, and v11's code is two revisions old. v13
#     took the two PC register writes in 3/14 under job_lock, and a kernel
#     built from v11 does not have that;
#   - v13 is written against next-20260914 and was sent against it. Building
#     it on a release means carrying backports of whatever the release lacks,
#     and that set grows every revision. It was four for v7.2 and nobody has
#     checked what it is now;
#   - the tag is pinned here and the run asserts that the tree it cloned is
#     the commit the patches name as their base. A base that drifts silently
#     is the failure this replaces.
#
# kernel/backport-7.2/ is not applied any more. Those four are other people's
# upstream commits and next-20260914 has them. The directory stays for anyone
# building on the release by hand; see its README.
name: kernel

on:
  workflow_dispatch:
    inputs:
      base:
        description: "linux-next tag to build on"
        default: "next-20260914"
      release:
        description: "publish a release"
        type: boolean
        default: false
  push:
    paths:
      - 'rfc-send-v13/**'
      - 'patches-extra/**'
      - 'kernel/base.config'
      - '.github/workflows/kernel.yml'

permissions:
  contents: write

jobs:
  build:
    # native aarch64: no cross toolchain to get wrong, and quicker than
    # cross-compiling on x86.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev bc \
            python3 ccache zstd

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.base || 'next-20260914' }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.base || 'next-20260914' }}-

      - name: fetch linux-next at the pinned tag
        run: |
          BASE="${{ inputs.base || 'next-20260914' }}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$BASE" \
            https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git linux
          git -C linux log --oneline -1

      - name: the tree is the commit the patches name
        run: |
          # next-20260914 is an ANNOTATED tag, so `git rev-parse <tag>` is the
          # tag object and not the commit. The clone above checks out the
          # commit, so HEAD is the right thing to compare.
          want=$(sed -n 's/^base-commit: //p' rfc-send-v13/v13-0000-cover-letter.patch)
          [ -n "$want" ] || { echo "::error::no base-commit in the v13 cover"; exit 1; }
          have=$(git -C linux rev-parse HEAD)
          echo "cover says  $want"
          echo "tree is     $have"
          [ "$want" = "$have" ] || {
            echo "::error::$BASE is not the base the v13 patches were generated on"
            exit 1
          }

      - name: apply the series
        run: |
          cd linux
          git config user.email ci@example.invalid
          git config user.name "charsiu CI"
          for p in ../rfc-send-v13/v13-00[0-9][0-9]-*.patch; do
            case "$p" in *-0000-*) continue ;; esac   # the cover letter
            echo "== $(basename "$p")"
            git am --keep-cr "$p" || {
              echo "::error::$(basename "$p") did not apply to $BASE"
              git am --abort || true
              exit 1
            }
          done
          for p in ../patches-extra/[0-9][0-9][0-9][0-9]-*.patch; do
            [ -e "$p" ] || break
            echo "== $(basename "$p")"
            git am --keep-cr "$p" || {
              echo "::error::$(basename "$p") did not apply to $BASE"
              git am --abort || true
              exit 1
            }
          done
          git log --oneline -14

      - name: build
        run: |
          cd linux
          cp ../kernel/base.config .config
          make ARCH=arm64 olddefconfig
          # DRM FIRST. DRM_ACCEL_ROCKET selects DRM_SCHED and
          # DRM_GEM_SHMEM_HELPER, so it cannot be y while DRM is m. Measured:
          # enabling only ROCKET leaves it at m and the assert below fails.
          scripts/config --enable DRM --enable DRM_ACCEL
          scripts/config --enable DRM_ACCEL_ROCKET
          # This rootfs has no udev and no mdev, so a module is NEVER loaded by
          # modalias. Anything a device needs has to be built in.
          scripts/config --enable STMMAC_ETH --enable STMMAC_PLATFORM
          scripts/config --enable DWMAC_ROCKCHIP --enable REALTEK_PHY
          scripts/config --enable RTC_DRV_HYM8563
          # CM5-IO's GMAC0 PHY is a YT8531C, not the RTL8211F its DT claims, so
          # REALTEK_PHY above does not cover it.  Without MOTORCOMM_PHY the
          # kernel falls back to the Generic PHY driver, which cannot do the
          # YT8531 clock and delay setup: measured on CM5-IO 2026-09-17 with
          # 7.3.0-rc3-next-20260914, "PHY [stmmac-0:01] driver [Generic PHY]"
          # and the link never came up with a cable plugged in.
          scripts/config --enable MOTORCOMM_PHY
          # Android USB tethering is RNDIS.  v7.2 had this and the port to
          # next-20260914 lost it, so a phone enumerates (04e8:6864, "network
          # tethering") and no interface appears.  A module is enough -- this
          # one is for a distro with udev, not the charsiu rootfs.
          scripts/config --module USB_NET_RNDIS_HOST
          # A distro on a 4 GB board needs its compressed swap.  Without ZRAM
          # Fedora's zram-generator logs `modprobe "zram" failed` and the board
          # runs with no swap at all: measured on CM5-IO 2026-09-17, 3.3 of
          # 3.5 GiB in use with 288 MiB available and the desktop stuttering
          # while panfrost_gem_shrinker_scan ran continuously, the kernel
          # evicting GPU buffers because there was nowhere else to reclaim from.
          scripts/config --module ZRAM
          scripts/config --enable ZSMALLOC
          scripts/config --enable ZRAM_BACKEND_ZSTD
          scripts/config --enable ZRAM_DEF_COMP_ZSTD
          grep '=y$' .config | sort > /tmp/y.before
          make ARCH=arm64 olddefconfig
          # WHAT THIS CATCHES: olddefconfig turns =y into =m on its own when a
          # symbol's dependencies have moved under it, and a module in this
          # rootfs is a driver that never loads. It cost a board session: the
          # ethernet and the RTC came out =m across a base change and only
          # Image was built. The four below are fatal; the rest is printed,
          # because a new base demoting something unrelated is news and not
          # necessarily a fault.
          comm -23 /tmp/y.before <(grep '=y$' .config | sort) \
            | sed 's/=y$//' > /tmp/demoted || true
          if [ -s /tmp/demoted ]; then
            echo "no longer =y after olddefconfig:"
            while read -r s; do echo "  $s is now $(scripts/config --state "${s#CONFIG_}")"; done < /tmp/demoted
          else
            echo "olddefconfig demoted nothing"
          fi
          bad=0
          for s in DRM_ACCEL_ROCKET STMMAC_ETH DWMAC_ROCKCHIP RTC_DRV_HYM8563 MOTORCOMM_PHY ZSMALLOC; do
            v=$(scripts/config --state $s)
            echo "  $s = $v"
            [ "$v" = "y" ] || { echo "::error::$s is $v, not y"; bad=1; }
          done
          [ "$bad" = 0 ]
          make ARCH=arm64 -j"$(nproc)" CC="ccache gcc" Image dtbs modules
          make ARCH=arm64 INSTALL_MOD_PATH=../modroot modules_install

      - name: package
        run: |
          mkdir -p out
          cp linux/arch/arm64/boot/Image out/
          cp linux/arch/arm64/boot/dts/rockchip/rk3576-rock-4d.dtb out/
          KVER=$(cat linux/include/config/kernel.release)
          tar -C modroot -czf "out/modules-$KVER.tar.gz" lib/modules
          {
            echo "base        $BASE  (an immutable linux-next tag)"
            # COUNT THE PATCHES, do not type the number. It has been wrong
            # once already: the series went 13 -> 14 when Igor's patch moved
            # inside, and a manifest that states a stale count is worse than
            # one that states none.
            nsp=$(ls rfc-send-v13/v13-00[0-9][0-9]-*.patch 2>/dev/null | grep -vc -- -0000- )
            [ "$nsp" -gt 0 ] || { echo "::error::the series count came out 0"; exit 1; }
            echo "series      v13, $nsp patches (Igor Paunovic's clocks-by-name is 1/14)"
            echo "backports   none: the four in kernel/backport-7.2 are in this base"
            echo "kernel      $KVER"
            echo "built       $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repo        ${{ github.repository }}@${{ github.sha }}"
          } > out/MANIFEST
          ( cd out && sha256sum Image rk3576-rock-4d.dtb modules-*.tar.gz > SHA256SUMS )
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          cat out/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KVER }}
          path: out/

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="kernel-$KVER-$(date -u +%Y%m%d)"
          gh release create "$TAG" out/* --title "$TAG" --notes \
          "RK3576 NPU kernel: linux-next $BASE plus the v13 rocket series, which
          carries Igor Paunovic's clocks-by-name patch as its own 1/14. The run
          asserts that the tree it built is the commit those patches name as
          their base.

          charsiu-install.sh fetches this. It keeps the kernel already on the
          card as a second extlinux entry, so if this one misbehaves the old
          one is one boot menu away."
