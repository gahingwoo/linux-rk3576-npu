# Two questions a pinned build cannot answer.
#
# 1. Does the v9 series still apply to TODAY's linux-next? That is what a
#    maintainer will do, and for a patchset under review "it stopped applying
#    three weeks ago" should not first arrive as a request to rebase.
#
# 2. Has mainline released anything newer than the tag kernel.yml pins? When it
#    has, the four cherry-picks in kernel/backport-7.2/ may already be in it and
#    the directory can go. They are other people's upstream commits and the only
#    reason they are carried here is that 7.2 shipped before they did.
#
# A failure here is INFORMATION, not a broken build.
name: patch drift

on:
  schedule:
    - cron: '17 4 * * 1'      # Mondays, before anyone asks
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED: v7.2

jobs:
  newer-release:
    runs-on: ubuntu-24.04
    steps:
      - name: is there a mainline release newer than the pinned one
        run: |
          git ls-remote --tags --refs \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git 'v[0-9]*' \
            | sed 's|.*refs/tags/||' | grep -vE 'rc|tree' | sort -V | tail -3 > /tmp/tags
          echo "newest mainline tags:"; sed 's/^/  /' /tmp/tags
          NEWEST=$(tail -1 /tmp/tags)
          echo "pinned: $PINNED   newest: $NEWEST"
          if [ "$NEWEST" != "$PINNED" ]; then
            echo "::warning::mainline $NEWEST is out and kernel.yml still pins $PINNED. Check whether kernel/backport-7.2/ is still needed"
          fi

  applies-to-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: fetch the tip of linux-next
        run: |
          git clone --depth 1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git linux
          echo "TIP=$(git -C linux log --format=%h -1)" >> "$GITHUB_ENV"
          git -C linux log --oneline -1

      - name: the series, against today's tree
        id: try
        run: |
          cd linux
          git config user.email ci@example.invalid
          git config user.name "charsiu CI"
          # ⚠ The prerequisite the cover letter names goes first. Nothing from
          # kernel/backport-7.2 is applied here: those exist only because the
          # RELEASE is older than the series, and linux-next already has them.
          git am --keep-cr ../rfc-send-v9/prereq/*.patch >/tmp/am.log 2>&1 || {
            echo "::warning::even the prerequisite no longer applies, so it may have been merged"
            sed 's/^/  /' /tmp/am.log | head -5
            git am --abort || true
          }
          fail=""
          for p in ../rfc-send-v9/v9-00[0-9][0-9]-*.patch; do
            case "$p" in *v9-0000-*) continue ;; esac
            n=$(basename "$p")
            if git am --keep-cr "$p" >/tmp/am.log 2>&1; then
              echo "  ok    $n"
            else
              echo "  FAIL  $n"
              sed 's/^/        /' /tmp/am.log
              git am --show-current-patch=diff 2>/dev/null \
                | grep -E '^(\+\+\+|---) ' | sort -u | sed 's/^/        /' || true
              git am --abort || true
              fail="$n"
              break
            fi
          done
          if [ -n "$fail" ]; then
            echo "::warning::the v9 series stops applying at $fail on linux-next $TIP"
            echo "failed=$fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "the whole series still applies to linux-next $TIP"

      - name: and it still compiles
        if: steps.try.outputs.failed == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu build-essential flex bison libssl-dev libelf-dev bc
          cd linux
          cp ../kernel/base.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # ⚠ DRM before ROCKET: it selects DRM_SCHED and DRM_GEM_SHMEM_HELPER
          # and cannot be y while DRM is m.
          scripts/config --enable DRM --enable DRM_ACCEL --enable DRM_ACCEL_ROCKET
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # not a full build: the driver, the pmdomain code and the dtb are
          # where a silent semantic conflict would show.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            drivers/accel/rocket/ drivers/pmdomain/rockchip/
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            rockchip/rk3576-rock-4d.dtb
